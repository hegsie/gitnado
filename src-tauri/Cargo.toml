[package]
name = "gitnado"
version = "0.9.0"
description = "A fully-featured, open-source, cross-platform Git GUI client"
authors = ["Gitnado Contributors"]
homepage = "https://gitnado.dev"
repository = "https://github.com/hegsie/gitnado"
edition = "2021"
# Derived from the dependency tree's own `rust_version` requirements, not chosen by hand.
# Recompute with:
#   cargo metadata --format-version 1 | python3 -c \
#     "import json,sys; d=json.load(sys.stdin); \
#      print(max((p['rust_version'], p['name'], p['version']) for p in d['packages'] if p.get('rust_version')))"
# As of this writing the ceiling is set by sysinfo 0.39.x (rust-version = 1.95).
rust-version = "1.95"

[lib]
name = "gitnado_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.21", features = ["vendored-openssl", "ssh", "https", "cred"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query", "form", "http2", "stream"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
base64 = "0.23.1"
urlencoding = "2.1.3"
uuid = { version = "1.23.2", features = ["v4"] }
glob = "0.3"
once_cell = "1"
chardetng = "1.0"
encoding_rs = "0.8"

# Archive support
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

# AI Provider System
async-trait = "0.1"
futures-util = "0.3"

# Local AI inference
sysinfo = "0.39"
llama-cpp-2 = { version = "0.1", default-features = false }

# Embedding & semantic search
sqlite-vec = "0.1.8-alpha.1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
hf-hub = { version = "0.5", features = ["tokio"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

# Secret detection
regex = "1"

# GitHub App JWT authentication
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }

# OAuth System
sha2 = "0.11"
rand = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"

# Keyring crate only used on non-macOS; macOS uses `security` CLI directly
# to avoid keychain ACL prompts that the keyring crate triggers on dev builds
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "linux-native"] }

[dev-dependencies]
tempfile = "3"
# Generates a throwaway RSA keypair so the GitHub App JWT signing path can be
# tested without committing a private key to the repo. Both crates are already
# in the tree via jsonwebtoken, so this adds no new dependencies.
aws-lc-rs = "1"
pem = "4"

# Also needed at runtime for ghost rebase temp worktrees
[dependencies.tempfile]
version = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
cuda = ["llama-cpp-2/cuda"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = "debuginfo"
