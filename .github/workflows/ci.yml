name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Explicit path because Node's test runner skips dot-directories.
      - name: Test workflow scripts
        run: node --test .github/scripts/*.test.mjs

      # Fails when the frontend invokes a Tauri command lib.rs does not register.
      - name: IPC contract test
        run: npm run test:contract

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libdbus-1-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          prefix-key: ubuntu-22.04

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  test-backend:
    name: Test Backend
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libdbus-1-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          prefix-key: ubuntu-22.04

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

  # macOS has its own credential-handling path (Cargo.toml shells out to the
  # `security` CLI instead of the `keyring` crate to avoid keychain ACL
  # prompts on dev builds) plus several other `#[cfg(target_os = "macos")]`
  # code paths (terminal opening, Finder "reveal", system detection). None of
  # that was exercised by a Linux or Windows runner, so it was only ever
  # verified by hand. This job is what makes "it works on macOS" a claim CI
  # can check.
  test-backend-macos:
    name: Test Backend (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          prefix-key: macos-latest

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

  # The rebase flows reach git through GIT_SEQUENCE_EDITOR/GIT_EDITOR, which
  # Git for Windows evaluates with its own bundled POSIX shell and its own path
  # rules. Nothing about that is exercised by a Linux runner, so the Windows
  # behaviour was only ever verified by hand. This job is what makes
  # "it works on Windows" a claim CI can check.
  test-backend-windows:
    name: Test Backend (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          prefix-key: windows-latest

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

  test-e2e:
    name: Test E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Blocking: advisories in dependencies that ship inside the app. These
      # reach users, so a moderate advisory here is a release blocker.
      - name: Audit npm production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # Advisory: dev-only tooling (test runner, linter, bundler) never ships.
      # A moderate advisory in a transitive dev dependency used to red-line
      # every unrelated PR until an upstream release landed, so it is reported
      # here and chased by the weekly security-audit workflow instead.
      - name: Audit npm dev dependencies (advisory)
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Install Rust stable
        if: always()
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        if: always()
        run: cargo install cargo-audit

      # `if: always()` so a failing npm audit cannot silently skip the Rust
      # audit, which is what used to happen.
      - name: Audit Rust dependencies
        if: always()
        working-directory: src-tauri
        run: cargo audit
