name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Explicit path because Node's test runner skips dot-directories.
      - name: Test workflow scripts
        run: node --test .github/scripts/*.test.mjs

      # Fails when the frontend invokes a Tauri command lib.rs does not register.
      - name: IPC contract test
        run: npm run test:contract

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libdbus-1-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          prefix-key: ubuntu-22.04

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  test-backend:
    name: Test Backend
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libdbus-1-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          prefix-key: ubuntu-22.04

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

  # macOS has its own credential-handling path (Cargo.toml shells out to the
  # `security` CLI instead of the `keyring` crate to avoid keychain ACL
  # prompts on dev builds) plus several other `#[cfg(target_os = "macos")]`
  # code paths (terminal opening, Finder "reveal", system detection). None of
  # that was exercised by a Linux or Windows runner, so it was only ever
  # verified by hand. This job is what makes "it works on macOS" a claim CI
  # can check.
  test-backend-macos:
    name: Test Backend (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          prefix-key: macos-latest

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: TEMP diagnose abort (nocapture, parallel)
        working-directory: src-tauri
        continue-on-error: true
        run: cargo test --lib -- --nocapture 2>&1 | tail -n 120

      - name: TEMP diagnose abort (single threaded, names the test)
        working-directory: src-tauri
        continue-on-error: true
        timeout-minutes: 45
        run: cargo test --lib -- --nocapture --test-threads=1 2>&1 | tail -n 40

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

  # The rebase flows reach git through GIT_SEQUENCE_EDITOR/GIT_EDITOR, which
  # Git for Windows evaluates with its own bundled POSIX shell and its own path
  # rules. Nothing about that is exercised by a Linux runner, so the Windows
  # behaviour was only ever verified by hand. This job is what makes
  # "it works on Windows" a claim CI can check.
  test-backend-windows:
    name: Test Backend (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          prefix-key: windows-latest

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: TEMP diagnose STATUS_ENTRYPOINT_NOT_FOUND
        working-directory: src-tauri
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          cargo test --no-run 2>&1 | Select-Object -Last 3
          $exe = Get-ChildItem target/debug/deps/gitnado_lib-*.exe |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Write-Host "== exe $($exe.FullName) size=$($exe.Length)"
          & $exe.FullName --list 2>&1 | Select-Object -First 3
          Write-Host "== direct run exit code: $LASTEXITCODE"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem -Path (Join-Path $vs 'VC\Tools\MSVC') -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          Write-Host "== dumpbin $($dumpbin.FullName)"
          Add-Type -Namespace Ldr -Name Api -MemberDefinition @'
          [System.Runtime.InteropServices.DllImport("kernel32", SetLastError=true, CharSet=System.Runtime.InteropServices.CharSet.Ansi)]
          public static extern System.IntPtr LoadLibraryA(string name);
          [System.Runtime.InteropServices.DllImport("kernel32", SetLastError=true, CharSet=System.Runtime.InteropServices.CharSet.Ansi)]
          public static extern System.IntPtr GetProcAddress(System.IntPtr module, string name);
          '@
          $imports = & $dumpbin.FullName /nologo /imports $exe.FullName
          $dll = $null
          $missing = 0
          foreach ($line in $imports) {
            if ($line -match '(?i)^\s{4}(\S+\.dll)\s*$') { $dll = $matches[1]; continue }
            if (-not $dll) { continue }
            if ($line -match '^\s+[0-9A-Fa-f]+\s+(\S+)\s*$') {
              $fn = $matches[1]
              $h = [Ldr.Api]::LoadLibraryA($dll)
              if ($h -eq [System.IntPtr]::Zero) { Write-Host "MISSING DLL: $dll"; $dll = $null; $missing++; continue }
              if ([Ldr.Api]::GetProcAddress($h, $fn) -eq [System.IntPtr]::Zero) {
                Write-Host "MISSING EXPORT: $dll -> $fn"
                $missing++
              }
            }
          }
          Write-Host "== import scan done, $missing unresolved"

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

  test-e2e:
    name: Test E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Blocking: advisories in dependencies that ship inside the app. These
      # reach users, so a moderate advisory here is a release blocker.
      - name: Audit npm production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # Advisory: dev-only tooling (test runner, linter, bundler) never ships.
      # A moderate advisory in a transitive dev dependency used to red-line
      # every unrelated PR until an upstream release landed, so it is reported
      # here and chased by the weekly security-audit workflow instead.
      - name: Audit npm dev dependencies (advisory)
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Install Rust stable
        if: always()
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        if: always()
        run: cargo install cargo-audit

      # `if: always()` so a failing npm audit cannot silently skip the Rust
      # audit, which is what used to happen.
      - name: Audit Rust dependencies
        if: always()
        working-directory: src-tauri
        run: cargo audit
