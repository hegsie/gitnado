name: Publish Packages

# Publishes each GitHub release to package managers:
#   - winget   (Windows)  — opens a PR against microsoft/winget-pkgs
#   - Homebrew (macOS)    — updates the cask in the hegsie/homebrew-gitnado tap
#   - Scoop    (Windows)  — updates packaging/scoop/gitnado.json on main
#
# One-time maintainer setup (secrets, tap repository, first winget submission)
# is documented in docs/packaging.md. Jobs that are missing their secret are
# skipped rather than failed, so the workflow degrades gracefully until each
# channel is set up.

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish packages for (e.g. v0.8.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preflight:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      has-winget-token: ${{ steps.secrets.outputs.has-winget-token }}
      has-homebrew-token: ${{ steps.secrets.outputs.has-homebrew-token }}
    steps:
      - name: Resolve tag and version
        id: release
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::No release tag available"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify release assets exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          assets=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}" \
            | jq -r '.assets[].name')
          for name in \
            "Gitnado_${VERSION}_x64-setup.exe" \
            "Gitnado_${VERSION}_x64_en-US.msi" \
            "Gitnado_${VERSION}_aarch64.dmg"; do
            if ! echo "$assets" | grep -qxF "$name"; then
              echo "::error::Release ${TAG} is missing asset ${name}"
              exit 1
            fi
          done

      # Secrets are not readable in job-level `if` conditions, so surface their
      # presence as outputs and gate the downstream jobs on those.
      - name: Check publishing secrets
        id: secrets
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          echo "has-winget-token=$([ -n "$WINGET_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has-homebrew-token=$([ -n "$HOMEBREW_TAP_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  winget:
    name: Publish to winget
    needs: preflight
    if: needs.preflight.outputs.has-winget-token == 'true'
    runs-on: ubuntu-latest
    env:
      WINGET_ID: hegsie.Gitnado
      TAG: ${{ needs.preflight.outputs.tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      # winget-releaser can only update a package that already exists in
      # winget-pkgs. Until the first Gitnado version is merged there, create
      # the package from scratch with Komac instead (same tool the action
      # uses); after that, every release goes through the update path.
      - name: Check whether the package exists in winget-pkgs
        id: exists
        run: |
          path="manifests/h/${WINGET_ID//./\/}"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/microsoft/winget-pkgs/contents/${path}")
          echo "exists=$([ "$code" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "winget-pkgs/${path}: HTTP ${code}"

      - name: Update existing package
        if: steps.exists.outputs.exists == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: hegsie.Gitnado
          installers-regex: '\.(exe|msi)$'
          release-tag: ${{ needs.preflight.outputs.tag }}
          max-versions-to-keep: 5
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Install Komac
        if: steps.exists.outputs.exists == 'false'
        uses: cargo-bins/cargo-binstall@main

      # Every field Komac would otherwise prompt for is passed explicitly so
      # the run is non-interactive; --submit opens the PR on winget-pkgs.
      - name: Create package (first submission)
        if: steps.exists.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          cargo binstall komac -y
          base="https://github.com/${{ github.repository }}"
          komac new "$WINGET_ID" \
            --version "$VERSION" \
            --urls "${base}/releases/download/${TAG}/Gitnado_${VERSION}_x64-setup.exe" \
                   "${base}/releases/download/${TAG}/Gitnado_${VERSION}_x64_en-US.msi" \
            --package-locale en-US \
            --publisher hegsie \
            --publisher-url https://gitnado.dev \
            --publisher-support-url "${base}/issues" \
            --package-name Gitnado \
            --package-url https://gitnado.dev \
            --moniker gitnado \
            --author "Gitnado Contributors" \
            --license MIT \
            --license-url "${base}/blob/main/LICENSE" \
            --copyright "Copyright © 2024 Gitnado Contributors" \
            --copyright-url "${base}/blob/main/LICENSE" \
            --short-description "Fast, privacy-first Git GUI client" \
            --description "A fully-featured, open-source, cross-platform Git GUI client. Interactive rebase, 3-way merge editor, worktrees, GitHub/GitLab/Azure DevOps/Bitbucket integrations and local AI commit messages, with no telemetry or account." \
            --release-notes-url "${base}/releases/tag/${TAG}" \
            --created-with "publish-packages workflow" \
            --created-with-url "${base}/blob/main/.github/workflows/publish-packages.yml" \
            --submit

  homebrew:
    name: Update Homebrew cask
    needs: preflight
    if: needs.preflight.outputs.has-homebrew-token == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute DMG checksum
        id: dmg
        run: |
          curl -fsSL -o gitnado.dmg \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}/Gitnado_${VERSION}_aarch64.dmg"
          echo "sha256=$(sha256sum gitnado.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          rm gitnado.dmg

      - name: Push cask to tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${{ github.repository_owner }}/homebrew-gitnado.git" tap
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/${VERSION}/g" -e "s/__SHA256__/${SHA256}/g" \
            packaging/homebrew/gitnado.rb.template > tap/Casks/gitnado.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/gitnado.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date for ${VERSION}"
            exit 0
          fi
          git commit -m "gitnado ${VERSION}"
          git push

  scoop:
    name: Update Scoop manifest
    needs: preflight
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update manifest
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/${TAG}/Gitnado_${VERSION}_x64_en-US.msi"
          curl -fsSL -o gitnado.msi "$url"
          hash=$(sha256sum gitnado.msi | cut -d' ' -f1)
          rm gitnado.msi
          jq --arg version "$VERSION" --arg url "$url" --arg hash "$hash" \
            '.version = $version
             | .architecture."64bit".url = $url
             | .architecture."64bit".hash = $hash' \
            packaging/scoop/gitnado.json > gitnado.json.tmp
          mv gitnado.json.tmp packaging/scoop/gitnado.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/scoop/gitnado.json
          if git diff --cached --quiet; then
            echo "Scoop manifest already up to date for ${VERSION}"
            exit 0
          fi
          git commit -m "chore: update Scoop manifest for ${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin main
